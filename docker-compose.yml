x-app: &app
  build: .
  image: curly-store:local
  env_file: .env
  environment:
    KAFKA_BOOTSTRAP_SERVERS: kafka:29092
  restart: unless-stopped
  depends_on:
    kafka:
      condition: service_healthy

services:
  kafka:
    image: confluentinc/cp-kafka:7.9.10
    hostname: kafka
    container_name: kafka-broker

    ports:
      - "${KAFKA_BIND_ADDRESS:-127.0.0.1}:${KAFKA_PORT:-9092}:9092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT

      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093

      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://${KAFKA_ADVERTISED_HOST:-localhost}:${KAFKA_PORT:-9092}

      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_DIRS: /var/lib/kafka/data

      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk

    volumes:
      - kafka-data:/var/lib/kafka/data

    restart: unless-stopped
    stop_grace_period: 1m

    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "kafka:29092", "--list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    <<: *app
    command: python -m uvicorn src.producer.event_generator:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/docs', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  validation:
    <<: *app
    command: python -m src.validation_consumer.validation

  recovery:
    <<: *app
    command: python -m src.dlq_consumer.dlq_consumer

  uploader:
    <<: *app
    command: python -m src.upload.uploader

  producer:
    <<: *app
    command: python -m src.producer.kafka-producer
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EVENT_GENERATOR_URL: http://api:8000/
    depends_on:
      kafka:
        condition: service_healthy
      api:
        condition: service_healthy

volumes:
  kafka-data:
