name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run unit-tests
        run: python -m unittest discover -s tests
      

  build:
    needs: [test]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build project
        run: docker build -t curly-store:ci .

      - name: Load SQL driver in container
        run: |
          docker run --rm -i curly-store:ci python - <<'PY'
          import ctypes
          from importlib.metadata import distribution

          dist = distribution("mssql-python-odbc")
          driver = next(path for path in dist.files
                        if path.name.startswith("libmsodbcsql") and ".so." in path.name)
          ctypes.CDLL(str(dist.locate_file(driver)))
          print("SQL driver loaded")
          PY
